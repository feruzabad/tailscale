services:
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ${TS_CONTAINER_NAME:-tailscale}
    hostname: ${TS_HOSTNAME:?set TS_HOSTNAME}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - state:/var/lib/tailscale
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  state:
    name: ${TS_STATE_VOLUME:-tailscale-state}
